[project]
name = "meeting-scribe"
version = "0.1.0"
description = "Local, real-time Korean meeting transcription (streaming partials + Whisper finals on GPU)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "sherpa-onnx>=1.10",
    "onnxruntime>=1.18",
    "soundfile>=0.12",
    "soxr>=0.3",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "huggingface-hub>=0.23",
    "pyside6-essentials>=6.7",
]

[project.scripts]
scribe = "scribe.cli:main"

[project.gui-scripts]
scribe-gui = "scribe.gui.app:main"  # no console window

[tool.uv]
# The Microsoft Store Python ignores venv site-packages; always use a uv-managed interpreter.
python-preference = "only-managed"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"  # GPU/model tests: pytest -m gpu
markers = [
    "gpu: needs the NVIDIA GPU and downloaded models",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_fixtures.py" = ["E501"]  # embedded PowerShell template
